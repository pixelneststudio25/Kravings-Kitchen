<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kravings Kitchen: Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{padding-bottom:0;}
  * { -webkit-tap-highlight-color: transparent; }

  /* ---------- Login ---------- */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--ash-900);border:1px solid var(--ash-line);border-radius:18px;padding:40px 28px;max-width:340px;width:100%;text-align:center;}
  .login-card img{height:40px;margin:0 auto 22px;}
  .login-card h2{font-size:1.25rem;margin-bottom:6px;}
  .login-card p{color:var(--paper-dim);font-size:.84rem;margin-bottom:22px;}
  .login-card input{width:100%;padding:15px 16px;background:var(--ash-800);border:1px solid var(--ash-line);border-radius:12px;color:var(--paper);font-size:1rem;margin-bottom:14px;font-family:inherit;}
  .login-card .btn{width:100%;border-radius:12px;}
  .login-error{color:#ff8a83;font-size:.82rem;margin-top:12px;min-height:1em;}

  /* ---------- App shell ---------- */
  #admin-app{min-height:100vh;display:flex;flex-direction:column;}
  .app-bar{
    position:sticky;top:0;z-index:150;background:rgba(13,13,12,.96);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--ash-line);padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .app-bar-left{display:flex;align-items:center;gap:10px;}
  .app-bar-left img{height:26px;}
  .app-bar-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;}
  .app-bar-actions{display:flex;gap:8px;}
  .bar-icon-btn{
    display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;
    background:var(--ash-800);border:1px solid var(--ash-line);color:var(--paper);cursor:pointer;transition:background .2s ease;
  }
  .bar-icon-btn:hover{background:var(--ash-700);}
  .bar-icon-btn svg{width:17px;height:17px;}

  .admin-scroll{flex:1;overflow-y:auto;padding:16px 16px 130px;max-width:720px;margin:0 auto;width:100%;}

  .status-msg{font-size:.83rem;padding:12px 14px;border-radius:10px;margin-bottom:16px;display:none;font-weight:600;}
  .status-msg.show{display:block;animation:slideDown .3s ease;}
  .status-msg.ok{background:rgba(232,89,12,.12);color:var(--orange);border:1px solid rgba(232,89,12,.3);}
  .status-msg.error{background:rgba(179,34,28,.14);color:#ff8a83;border:1px solid rgba(179,34,28,.35);}
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Section framing ---------- */
  .section-label{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 2px 10px;margin-top:22px;
  }
  .section-label:first-child{margin-top:0;}
  .section-label h2{font-size:.72rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--paper-dim);font-weight:800;}

  /* ---------- Categories ---------- */
  .cat-list{background:var(--ash-900);border:1px solid var(--ash-line);border-radius:14px;overflow:hidden;}
  .cat-row{display:flex;align-items:center;gap:8px;padding:12px 12px;border-bottom:1px solid var(--ash-line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row input{
    flex:1;min-width:0;background:transparent;border:none;color:var(--paper);
    padding:6px 4px;font-family:'Playfair Display',serif;font-size:.98rem;font-weight:700;
  }
  .cat-row input:focus{outline:none;border-bottom:1px solid var(--orange);}
  .cat-row-actions{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn{
    background:var(--ash-800);border:1px solid var(--ash-line);color:var(--paper);width:32px;height:32px;
    border-radius:9px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:background .2s ease;
  }
  .icon-btn:hover{background:var(--ash-700);}
  .icon-btn.danger:hover{background:var(--red);border-color:var(--red);}
  .add-category-btn{
    width:100%;padding:13px;background:transparent;border:1px dashed var(--ash-line);border-radius:14px;
    color:var(--paper-dim);font-weight:700;font-size:.85rem;cursor:pointer;margin-top:10px;transition:all .2s ease;
  }
  .add-category-btn:hover{border-color:var(--orange);color:var(--orange);}

  /* ---------- Item category accordion ---------- */
  .cat-panel{background:var(--ash-900);border:1px solid var(--ash-line);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .cat-panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;cursor:pointer;
    -webkit-user-select:none;user-select:none;
  }
  .cat-panel-head-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .cat-panel-head h3{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat-panel-count{
    flex-shrink:0;background:var(--ash-800);color:var(--paper-dim);font-size:.72rem;font-weight:700;
    padding:2px 9px;border-radius:999px;
  }
  .chevron{
    width:18px;height:18px;flex-shrink:0;transition:transform .25s ease;color:var(--paper-dim);
  }
  .cat-panel.open .chevron{transform:rotate(180deg);}
  .cat-panel-body{display:none;padding:0 12px 14px;}
  .cat-panel.open .cat-panel-body{display:block;}

  /* ---------- Item card (collapsed by default) ---------- */
  .item-card{background:var(--ash-800);border:1px solid var(--ash-line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .item-card:last-child{margin-bottom:0;}
  .item-summary{
    display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;
  }
  .item-photo-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--ash-700);}
  .item-summary-text{flex:1;min-width:0;}
  .item-summary-text .name{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-summary-text .price{font-size:.8rem;color:var(--orange);font-family:'Playfair Display',serif;font-weight:700;}
  .item-card.open .chevron{transform:rotate(180deg);}

  .item-detail{display:none;padding:0 14px 16px;}
  .item-card.open .item-detail{display:block;}
  .item-fields{display:flex;flex-direction:column;gap:10px;padding-top:4px;}
  .field-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--paper-dim);font-weight:700;margin-bottom:5px;display:block;}
  .item-fields input[type="text"], .item-fields input[type="number"], .item-fields textarea{
    width:100%;background:var(--ash-900);border:1px solid var(--ash-line);border-radius:9px;color:var(--paper);
    padding:11px 12px;font-family:inherit;font-size:.9rem;
  }
  .item-fields textarea{resize:vertical;min-height:60px;}
  .photo-upload-row{display:flex;align-items:center;gap:12px;}
  .photo-upload-row .item-photo-thumb{width:56px;height:56px;}
  .file-btn{
    position:relative;overflow:hidden;background:var(--ash-900);border:1px solid var(--ash-line);color:var(--paper);
    padding:10px 16px;border-radius:9px;font-size:.82rem;font-weight:700;cursor:pointer;flex:1;text-align:center;
  }
  .file-btn input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .variant-toggle{display:flex;align-items:center;gap:9px;font-size:.85rem;color:var(--paper);padding:2px 0;}
  .variant-toggle input{width:18px;height:18px;accent-color:var(--orange);}
  .variant-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .variant-row input{flex:1;min-width:0;}
  .add-size-btn{
    background:transparent;border:1px dashed var(--ash-line);color:var(--paper-dim);padding:9px;border-radius:9px;
    font-size:.8rem;font-weight:700;cursor:pointer;width:100%;transition:all .2s ease;
  }
  .add-size-btn:hover{border-color:var(--orange);color:var(--orange);}
  .item-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;}
  .text-danger-btn{background:none;border:none;color:var(--paper-dim);font-size:.82rem;font-weight:700;cursor:pointer;padding:8px 4px;}
  .text-danger-btn:hover{color:#ff8a83;}
  .save-btn{
    background:var(--orange);border:1px solid var(--orange);color:var(--ash-950);padding:10px 22px;
    border-radius:9px;font-size:.85rem;font-weight:800;cursor:pointer;transition:background .2s ease;
  }
  .save-btn:hover{background:#c94e0a;}
  .add-item-btn{
    width:100%;border:1px dashed var(--ash-line);background:transparent;color:var(--paper-dim);padding:13px;
    border-radius:11px;cursor:pointer;font-weight:700;font-size:.83rem;transition:all .2s ease;margin-top:2px;
  }
  .add-item-btn:hover{border-color:var(--orange);color:var(--orange);}

  /* ---------- Publish bar ---------- */
  .publish-bar{
    position:sticky;bottom:0;left:0;right:0;background:rgba(22,21,19,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--ash-line);padding:14px 16px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:140;
  }
  .publish-status{font-size:.78rem;color:var(--paper-dim);line-height:1.3;}
  .publish-status.dirty{color:var(--orange);font-weight:700;}
  .publish-bar .btn{padding:13px 22px;font-size:.85rem;flex-shrink:0;}

  .empty-note{color:var(--paper-dim);font-size:.85rem;text-align:center;padding:30px 10px;}

  @media (min-width:640px){
    .admin-scroll{padding:24px 24px 130px;}
    .app-bar{padding:16px 24px;padding-top:calc(16px + env(safe-area-inset-top));}
    .item-detail{padding:0 16px 18px;}
  }
</style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <img src="images/kravings-logo.png" alt="Kravings Kitchen">
    <h2>Admin access</h2>
    <p>Enter the admin password to manage the menu.</p>
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="login-btn">Log in</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<div id="admin-app" style="display:none;">
  <div class="app-bar">
    <div class="app-bar-left">
      <img src="images/kravings-logo.png" alt="">
      <span class="app-bar-title">Menu admin</span>
    </div>
    <div class="app-bar-actions">
      <button class="bar-icon-btn" id="refresh-btn" title="Reload draft" aria-label="Reload draft">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>
      </button>
      <button class="bar-icon-btn" id="logout-btn" title="Log out" aria-label="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </div>

  <div class="admin-scroll">
    <div id="status-msg" class="status-msg"></div>

    <div class="section-label"><h2>Categories</h2></div>
    <div class="cat-list" id="categories-list"></div>
    <button class="add-category-btn" id="add-category-btn">+ Add category</button>

    <div class="section-label"><h2>Items</h2></div>
    <div id="items-panels"></div>
  </div>

  <div class="publish-bar">
    <span class="publish-status" id="publish-status">Draft matches the live site.</span>
    <button class="btn" id="publish-btn">Publish</button>
  </div>
</div>

<script>
  // ====== SUPABASE PROJECT SETTINGS ======
  var SUPABASE_URL = 'https://eufuhzjsnhrabxkspxjh.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZnVoempzbmhyYWJ4a3NweGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTI0MDcsImV4cCI6MjEwNDc4ODQwN30.5r69GeVwjBMCzfOZOonpF8BJGkDFPaxKBmokCghSmNY';
  var ADMIN_EMAIL = 'danielekeamadi@gmail.com';
  // ========================================

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var loginScreen = document.getElementById('login-screen');
  var adminApp = document.getElementById('admin-app');
  var passwordInput = document.getElementById('password-input');
  var loginBtn = document.getElementById('login-btn');
  var loginError = document.getElementById('login-error');

  var state = { categories: [], items: [], dirty: false, openCategoryId: null, openItemId: null };

  var chevronSvg = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

  function setStatus(msg, type){
    var el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status-msg show ' + (type || 'ok');
    setTimeout(function(){ el.classList.remove('show'); }, 4000);
  }
  function markDirty(){
    state.dirty = true;
    var ps = document.getElementById('publish-status');
    ps.textContent = 'Unpublished changes waiting.';
    ps.classList.add('dirty');
  }
  function markClean(){
    state.dirty = false;
    var ps = document.getElementById('publish-status');
    ps.textContent = 'Draft matches the live site.';
    ps.classList.remove('dirty');
  }

  async function checkSession(){
    var { data } = await supabase.auth.getSession();
    if(data.session){ showAdmin(); } else { showLogin(); }
  }
  function showLogin(){ loginScreen.style.display = 'flex'; adminApp.style.display = 'none'; }
  function showAdmin(){ loginScreen.style.display = 'none'; adminApp.style.display = 'flex'; loadDraft(); }

  loginBtn.addEventListener('click', async function(){
    loginError.textContent = '';
    var password = passwordInput.value;
    if(!password){ loginError.textContent = 'Enter the password.'; return; }
    var { error } = await supabase.auth.signInWithPassword({ email: ADMIN_EMAIL, password: password });
    if(error){ loginError.textContent = 'Wrong password.'; return; }
    showAdmin();
  });
  passwordInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') loginBtn.click(); });

  document.getElementById('logout-btn').addEventListener('click', async function(){
    await supabase.auth.signOut();
    showLogin();
  });

  document.getElementById('refresh-btn').addEventListener('click', loadDraft);

  async function loadDraft(){
    var { data: categories, error: catErr } = await supabase.from('categories').select('*').order('sort_order');
    var { data: items, error: itemErr } = await supabase.from('items').select('*').order('sort_order');
    if(catErr || itemErr){ setStatus('Could not load the draft. Check your connection.', 'error'); return; }
    state.categories = categories || [];
    state.items = items || [];
    renderAll();
    markClean();
  }

  function renderAll(){
    renderCategories();
    renderItemPanels();
  }

  function renderCategories(){
    var list = document.getElementById('categories-list');
    list.innerHTML = '';
    if(!state.categories.length){
      list.innerHTML = '<p class="empty-note">No categories yet.</p>';
      return;
    }
    state.categories.forEach(function(cat, i){
      var row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML =
        '<input type="text" value="' + escAttr(cat.label) + '">' +
        '<div class="cat-row-actions">' +
          '<button class="icon-btn" data-action="up" title="Move up">\u2191</button>' +
          '<button class="icon-btn" data-action="down" title="Move down">\u2193</button>' +
          '<button class="icon-btn danger" data-action="delete" title="Delete category">\u2715</button>' +
        '</div>';
      row.querySelector('input').addEventListener('change', async function(e){
        var { error } = await supabase.from('categories').update({ label: e.target.value }).eq('id', cat.id);
        if(error){ setStatus('Could not rename category.', 'error'); } else { markDirty(); cat.label = e.target.value; renderItemPanels(); }
      });
      row.querySelector('[data-action="up"]').addEventListener('click', function(){ moveCategory(i, -1); });
      row.querySelector('[data-action="down"]').addEventListener('click', function(){ moveCategory(i, 1); });
      row.querySelector('[data-action="delete"]').addEventListener('click', function(){ deleteCategory(cat); });
      list.appendChild(row);
    });
  }

  async function moveCategory(index, dir){
    var target = index + dir;
    if(target < 0 || target >= state.categories.length) return;
    var a = state.categories[index], b = state.categories[target];
    var tmp = a.sort_order; a.sort_order = b.sort_order; b.sort_order = tmp;
    await supabase.from('categories').update({ sort_order: a.sort_order }).eq('id', a.id);
    await supabase.from('categories').update({ sort_order: b.sort_order }).eq('id', b.id);
    state.categories.sort(function(x,y){ return x.sort_order - y.sort_order; });
    markDirty();
    renderAll();
  }

  async function deleteCategory(cat){
    if(!confirm('Delete "' + cat.label + '" and every item in it? This cannot be undone.')) return;
    await supabase.from('items').delete().eq('category_id', cat.id);
    await supabase.from('categories').delete().eq('id', cat.id);
    markDirty();
    loadDraft();
  }

  document.getElementById('add-category-btn').addEventListener('click', async function(){
    var label = prompt('New category name:');
    if(!label) return;
    var key = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    var maxOrder = state.categories.reduce(function(m,c){ return Math.max(m, c.sort_order); }, 0);
    var { error } = await supabase.from('categories').insert({ key: key, label: label, sort_order: maxOrder + 10 });
    if(error){ setStatus('Could not add category. The internal key may already exist.', 'error'); return; }
    markDirty();
    loadDraft();
  });

  function renderItemPanels(){
    var wrap = document.getElementById('items-panels');
    wrap.innerHTML = '';
    if(!state.categories.length){
      wrap.innerHTML = '<p class="empty-note">Add a category first.</p>';
      return;
    }
    state.categories.forEach(function(cat){
      var itemsInCat = state.items.filter(function(it){ return it.category_id === cat.id; });
      var panel = document.createElement('div');
      panel.className = 'cat-panel' + (state.openCategoryId === cat.id ? ' open' : '');

      var head = document.createElement('div');
      head.className = 'cat-panel-head';
      head.innerHTML =
        '<div class="cat-panel-head-left"><h3>' + escHtml(cat.label) + '</h3>' +
        '<span class="cat-panel-count">' + itemsInCat.length + '</span></div>' + chevronSvg;
      head.addEventListener('click', function(){
        state.openCategoryId = (state.openCategoryId === cat.id) ? null : cat.id;
        renderItemPanels();
      });
      panel.appendChild(head);

      var body = document.createElement('div');
      body.className = 'cat-panel-body';
      itemsInCat.forEach(function(item){ body.appendChild(renderItemCard(item)); });
      var addBtn = document.createElement('button');
      addBtn.className = 'add-item-btn';
      addBtn.textContent = '+ Add item';
      addBtn.addEventListener('click', function(e){ e.stopPropagation(); addItem(cat); });
      body.appendChild(addBtn);
      panel.appendChild(body);

      wrap.appendChild(panel);
    });
  }

  function summaryPrice(item){
    if(item.variants && item.variants.length){
      var prices = item.variants.map(function(v){ return v.price; });
      return '\u20A6' + Math.min.apply(null, prices).toLocaleString('en-NG') + ' \u2013 \u20A6' + Math.max.apply(null, prices).toLocaleString('en-NG');
    }
    return item.price != null ? '\u20A6' + Number(item.price).toLocaleString('en-NG') : 'No price set';
  }

  function renderItemCard(item){
    var card = document.createElement('div');
    var isOpen = state.openItemId === item.id;
    card.className = 'item-card' + (isOpen ? ' open' : '');
    var hasVariants = !!(item.variants && item.variants.length);

    var summary = document.createElement('div');
    summary.className = 'item-summary';
    summary.innerHTML =
      '<img class="item-photo-thumb" src="' + escAttr(item.photo_url || '') + '" alt="">' +
      '<div class="item-summary-text"><div class="name">' + escHtml(item.name) + '</div>' +
      '<div class="price">' + summaryPrice(item) + '</div></div>' + chevronSvg;
    summary.addEventListener('click', function(){
      state.openItemId = isOpen ? null : item.id;
      renderItemPanels();
    });
    card.appendChild(summary);

    var detail = document.createElement('div');
    detail.className = 'item-detail';
    detail.innerHTML =
      '<div class="item-fields">' +
        '<div><span class="field-label">Name</span><input type="text" class="f-name" value="' + escAttr(item.name) + '"></div>' +
        '<div><span class="field-label">Description</span><textarea class="f-note">' + escHtml(item.note || '') + '</textarea></div>' +
        '<div><span class="field-label">Photo</span>' +
          '<div class="photo-upload-row">' +
            '<img class="item-photo-thumb" src="' + escAttr(item.photo_url || '') + '" alt="">' +
            '<label class="file-btn">Change photo<input type="file" class="f-photo" accept="image/*"></label>' +
          '</div>' +
        '</div>' +
        '<label class="variant-toggle"><input type="checkbox" class="f-has-variants"' + (hasVariants ? ' checked' : '') + '> Has sizes (small / medium / large) instead of one price</label>' +
        '<div class="f-single-price" style="' + (hasVariants ? 'display:none' : '') + '">' +
          '<span class="field-label">Price (\u20A6)</span><input type="number" class="f-price" value="' + (item.price != null ? item.price : '') + '">' +
        '</div>' +
        '<div class="f-variants" style="' + (hasVariants ? '' : 'display:none') + '"></div>' +
      '</div>' +
      '<div class="item-actions">' +
        '<button class="text-danger-btn" data-action="delete">Delete item</button>' +
        '<button class="save-btn" data-action="save">Save</button>' +
      '</div>';
    card.appendChild(detail);

    var variantsWrap = detail.querySelector('.f-variants');
    var variants = hasVariants ? item.variants.slice() : [{ label: 'Small', price: '' }, { label: 'Large', price: '' }];
    function renderVariantRows(){
      variantsWrap.innerHTML = '';
      variants.forEach(function(v, i){
        var row = document.createElement('div');
        row.className = 'variant-row';
        row.innerHTML =
          '<input type="text" value="' + escAttr(v.label) + '" placeholder="Size">' +
          '<input type="number" value="' + (v.price != null ? v.price : '') + '" placeholder="Price">' +
          '<button class="icon-btn danger" type="button">\u2715</button>';
        row.children[0].addEventListener('input', function(e){ variants[i].label = e.target.value; });
        row.children[1].addEventListener('input', function(e){ variants[i].price = Number(e.target.value); });
        row.children[2].addEventListener('click', function(){ variants.splice(i,1); renderVariantRows(); });
        variantsWrap.appendChild(row);
      });
      var addVariantBtn = document.createElement('button');
      addVariantBtn.className = 'add-size-btn';
      addVariantBtn.type = 'button';
      addVariantBtn.textContent = '+ Add size';
      addVariantBtn.addEventListener('click', function(){ variants.push({ label: '', price: '' }); renderVariantRows(); });
      variantsWrap.appendChild(addVariantBtn);
    }
    renderVariantRows();

    detail.querySelector('.f-has-variants').addEventListener('change', function(e){
      detail.querySelector('.f-single-price').style.display = e.target.checked ? 'none' : '';
      variantsWrap.style.display = e.target.checked ? '' : 'none';
    });

    var photoInput = detail.querySelector('.f-photo');
    var photoThumbs = detail.querySelectorAll('.item-photo-thumb');
    photoInput.addEventListener('change', function(){
      var file = photoInput.files[0];
      if(!file) return;
      var url = URL.createObjectURL(file);
      photoThumbs.forEach(function(img){ img.src = url; });
    });

    detail.querySelector('[data-action="delete"]').addEventListener('click', async function(e){
      e.stopPropagation();
      if(!confirm('Delete "' + item.name + '"?')) return;
      await supabase.from('items').delete().eq('id', item.id);
      markDirty();
      loadDraft();
    });

    detail.querySelector('[data-action="save"]').addEventListener('click', async function(e){
      e.stopPropagation();
      var name = detail.querySelector('.f-name').value.trim();
      var note = detail.querySelector('.f-note').value.trim();
      var usesVariants = detail.querySelector('.f-has-variants').checked;
      var photoFile = photoInput.files[0];
      var payload = { name: name, note: note };

      if(usesVariants){
        payload.price = null;
        payload.variants = variants.filter(function(v){ return v.label && v.price !== ''; }).map(function(v){ return { label: v.label, price: Number(v.price) }; });
      } else {
        payload.price = Number(detail.querySelector('.f-price').value) || 0;
        payload.variants = null;
      }

      if(photoFile){
        var path = 'items/' + Date.now() + '-' + photoFile.name.replace(/\s+/g, '-');
        var { error: uploadErr } = await supabase.storage.from('menu-photos').upload(path, photoFile);
        if(uploadErr){ setStatus('Photo upload failed: ' + uploadErr.message, 'error'); return; }
        var { data: urlData } = supabase.storage.from('menu-photos').getPublicUrl(path);
        payload.photo_url = urlData.publicUrl;
      }

      var { error } = await supabase.from('items').update(payload).eq('id', item.id);
      if(error){ setStatus('Could not save item.', 'error'); return; }
      setStatus('Saved "' + name + '" to draft.', 'ok');
      markDirty();
      loadDraft();
    });

    return card;
  }

  async function addItem(cat){
    var { error, data } = await supabase.from('items').insert({
      category_id: cat.id, name: 'New item', note: '', price: 0,
      sort_order: (state.items.filter(function(i){return i.category_id===cat.id;}).length + 1) * 10
    }).select().single();
    if(error){ setStatus('Could not add item.', 'error'); return; }
    markDirty();
    state.openCategoryId = cat.id;
    if(data) state.openItemId = data.id;
    loadDraft();
  }

  document.getElementById('publish-btn').addEventListener('click', async function(){
    var snapshot = {};
    state.categories.forEach(function(cat){
      var itemsInCat = state.items.filter(function(it){ return it.category_id === cat.id; });
      snapshot[cat.key] = {
        label: cat.label,
        items: itemsInCat.map(function(it){
          var out = { id: it.id, name: it.name, note: it.note, photo: it.photo_url };
          if(it.variants && it.variants.length){ out.variants = it.variants; } else { out.price = it.price; }
          return out;
        })
      };
    });
    var { error } = await supabase.from('published_snapshot').update({ data: snapshot, updated_at: new Date().toISOString() }).eq('id', 1);
    if(error){ setStatus('Publish failed: ' + error.message, 'error'); return; }
    setStatus('Published. The live site now shows these changes.', 'ok');
    markClean();
  });

  function escHtml(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function escAttr(s){ return String(s || '').replace(/"/g, '&quot;'); }

  checkSession();
</script>

</body>
</html>
